name: Build for Raspberry Pi (aarch64)

on:
  workflow_dispatch:  # manual trigger only (Actions → Build for Raspberry Pi → Run workflow)

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # native arm64 runner — no cross-compilation needed

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show  # activates toolchain from rust-toolchain.toml if present, else stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libmpv-dev

      - name: Build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gallerypi-aarch64
          path: target/release/gallerypi
          retention-days: 14
