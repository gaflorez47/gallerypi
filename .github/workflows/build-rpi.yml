name: Build for Raspberry Pi (aarch64)

on:
  workflow_dispatch:  # manual trigger only (Actions → Build for Raspberry Pi → Run workflow)

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # native arm64 runner — no cross-compilation needed

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show  # activates toolchain from rust-toolchain.toml if present, else stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-ffmpeg7-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-ffmpeg7-

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libasound2-dev \
            libclang-dev

      - name: Verify FFmpeg version
        run: |
          pkg-config --modversion libavutil
          ldconfig -p | grep libavutil
          pkg-config --modversion libavutil | grep -q "^59\." || (echo "ERROR: libavutil 59.x required, got $(pkg-config --modversion libavutil)" && exit 1)

      - name: Build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gallerypi-aarch64
          path: target/release/gallerypi
          retention-days: 14
